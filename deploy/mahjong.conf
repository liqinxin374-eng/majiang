# 1. HTTP 80 端口：支持 IPv4/IPv6，自动强制 301 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.xiguazi.online xiguazi.online;

    # 定时闹钟节假日云端反向代理
    location ^~ /alarm/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 端口：全站 HTTP/2 + TLS 加密 + 动静态优化 + WSS 长连接
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.xiguazi.online xiguazi.online;

    # 腾讯云 SSL 证书配置
    ssl_certificate /etc/nginx/ssl/xiguazi.online_nginx/xiguazi.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/xiguazi.online_nginx/xiguazi.online.key;

    # SSL 握手性能优化与会话复用
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 定时闹钟节假日云端反向代理
    location ^~ /alarm/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # 静态资源缓存加速
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|mp3|wav|ogg)$ {
        root /var/www/mahjong;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 游戏前端单页应用入口
    location / {
        root /var/www/mahjong;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 麻将 REST API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WSS 实时对局长连接代理
    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
