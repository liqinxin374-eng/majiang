name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS Project with Xcode
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcode-build.log

      - name: Package Standard iOS IPA with Valid CodeSignature & Assets
        run: |
          cd ios/App
          rm -rf build/Payload build/facai-mahjong-ios.ipa
          mkdir -p build/Payload
          
          # 1. 复制 App.app 并保持权限
          cp -RP build/Build/Products/Release-iphoneos/App.app build/Payload/App.app
          
          # 2. 注入 8MB+ 前端游戏资源
          mkdir -p build/Payload/App.app/public
          cp -RP App/public/* build/Payload/App.app/public/
          
          # 3. 确保 Mach-O 可执行文件具备执行权限
          chmod +x build/Payload/App.app/App
          
          # 4. 关键：注入 Ad-Hoc 初始签名结构，确保爱思助手/Sideloadly 解析与重签名 100% 成功
          codesign --force --deep --sign - build/Payload/App.app
          
          # 5. 使用 -y 保持符号链接封包为标准 IPA
          cd build
          zip -q -r -y facai-mahjong-ios.ipa Payload/
          
          echo "=== 验证 IPA 文件结构 ==="
          ls -lh facai-mahjong-ios.ipa
          codesign -dvvv Payload/App.app

      - name: Report Error Summary on Failure
        if: failure()
        run: |
          echo "## ❌ iOS 构建失败诊断报告" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f ios/App/xcode-build.log ]; then
            tail -n 80 ios/App/xcode-build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "未找到 Xcode 日志文件。" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload iOS IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: facai-mahjong-ios-ipa
          path: ios/App/build/facai-mahjong-ios.ipa
          retention-days: 30

      - name: Release Latest IPA to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "指尖麻将最新版本 (iOS & Android)"
          draft: false
          prerelease: false
          files: ios/App/build/facai-mahjong-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
