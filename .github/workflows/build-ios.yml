name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS Project with Xcode
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee xcode-build.log

      - name: Report Xcode Error Summary on Failure
        if: failure()
        run: |
          echo "## iOS 构建失败日志尾部" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ios/App/xcode-build.log ]; then
            tail -n 120 ios/App/xcode-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未找到 ios/App/xcode-build.log，说明失败发生在 Xcode 启动前。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xcode Log Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build-log
          path: ios/App/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package Resign-Ready Unsigned iOS IPA and App Bundle
        run: |
          cd ios/App/build
          APP_BUNDLE="Build/Products/Debug-iphoneos/App.app"

          rm -rf Payload facai-mahjong-ios.ipa
          rm -f App.app.zip
          test -d "$APP_BUNDLE"
          mkdir -p Payload
          
          # 1. 使用 ditto 复制 Xcode 产物，保留 iOS App 需要的目录结构、权限和符号链接。
          ditto "$APP_BUNDLE" Payload/App.app

          # 2. 这是给爱思助手、Sideloadly 等工具重签的未签名包，先清掉旧签名与旧描述文件。
          find Payload/App.app -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          rm -f Payload/App.app/embedded.mobileprovision

          # 3. 只给主程序可执行权限，不把图片、网页资源全部改成可执行文件。
          chmod 755 Payload/App.app/App

          # 4. 打包前做基础校验，避免上传结构不完整的 IPA。
          plutil -lint Payload/App.app/Info.plist
          test -f Payload/App.app/App
          test -d Payload/App.app/public
          test -f Payload/App.app/public/index.html

          # 5. 生成标准 IPA，顶层必须只有 Payload/ 文件夹。
          zip -q -r -y facai-mahjong-ios.ipa Payload

          # 6. 校验 zip 容器和关键文件路径，提前发现“包损坏”类问题。
          unzip -t -q facai-mahjong-ios.ipa
          unzip -l facai-mahjong-ios.ipa | grep -q "Payload/App.app/Info.plist"
          unzip -l facai-mahjong-ios.ipa | grep -q "Payload/App.app/App"
          unzip -l facai-mahjong-ios.ipa | grep -q "Payload/App.app/public/index.html"

          # 7. 同时生成 App.app 纯净压缩包作为备用，解压后顶层就是 App.app。
          ditto -c -k --sequesterRsrc --keepParent Payload/App.app App.app.zip

          echo "=== 查看产物文件信息 ==="
          ls -lh facai-mahjong-ios.ipa App.app.zip
          echo "注意：从 GitHub Actions 下载 Artifact 后，要先解压外层 zip，再把里面的 facai-mahjong-ios.ipa 拿去重签。" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unzip-first-then-sign-facai-mahjong-ios-ipa
          path: ios/App/build/facai-mahjong-ios.ipa
          retention-days: 30

      - name: Upload App Bundle Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: facai-mahjong-App-bundle
          path: ios/App/build/App.app.zip
          retention-days: 30
