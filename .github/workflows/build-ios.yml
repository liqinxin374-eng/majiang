name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS Project with Xcode
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcode-build.log

      - name: Package Standard iOS IPA
        run: |
          cd ios/App
          rm -rf build/Payload build/facai-mahjong-ios.ipa
          mkdir -p build/Payload
          
          # 使用 -RP 严格保留符号链接与二进制元数据
          cp -RP build/Build/Products/Release-iphoneos/App.app build/Payload/App.app
          
          # 注入全量 8MB+ 前端游戏资源
          mkdir -p build/Payload/App.app/public
          cp -RP App/public/* build/Payload/App.app/public/
          
          # 关键：使用 zip -r -y 保留 App 内部所有 Framework 的符号链接，彻底解决爱思助手“文件已损坏”问题
          cd build
          zip -q -r -y facai-mahjong-ios.ipa Payload/
          
          echo "=== 打包完成，查看 IPA 文件信息 ==="
          ls -lh facai-mahjong-ios.ipa

      - name: Report Error Summary on Failure
        if: failure()
        run: |
          echo "## ❌ iOS 构建失败诊断报告" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f ios/App/xcode-build.log ]; then
            tail -n 80 ios/App/xcode-build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "未找到 Xcode 日志文件。" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload iOS IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: facai-mahjong-ios-ipa
          path: ios/App/build/facai-mahjong-ios.ipa
          retention-days: 30

      - name: Create GitHub Release (Optional for Tags)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: ios/App/build/facai-mahjong-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
