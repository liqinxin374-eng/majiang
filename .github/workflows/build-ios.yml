name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS Project with Xcode
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package Standard iOS IPA and App Bundle
        run: |
          cd ios/App/build
          rm -rf Payload facai-mahjong-ios.ipa
          mkdir -p Payload
          
          # 1. 复制 App.app 到 Payload 目录并保持权限与符号链接
          cp -RP Build/Products/Debug-iphoneos/App.app Payload/App.app
          
          # 2. 注入全量 8MB+ 前端游戏资源与音画
          mkdir -p Payload/App.app/public
          cp -RP ../App/public/* Payload/App.app/public/
          
          # 3. 赋予可执行文件 755 权限
          chmod -R 755 Payload/App.app
          
          # 4. 生成标准 IPA (顶层只有 Payload/ 文件夹)
          zip -q -r -y facai-mahjong-ios.ipa Payload
          
          # 5. 同时生成 App.app 纯净压缩包作为备用
          zip -q -r -y App.app.zip Payload/App.app
          
          echo "=== 查看产物文件信息 ==="
          ls -lh facai-mahjong-ios.ipa App.app.zip

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: facai-mahjong-ios-ipa
          path: ios/App/build/facai-mahjong-ios.ipa
          retention-days: 30

      - name: Upload App Bundle Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: facai-mahjong-App-bundle
          path: ios/App/build/App.app.zip
          retention-days: 30
